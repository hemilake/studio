# Fork (Hemilake bundle): builds the self-contained Studio that hemi installs, one
# archive per platform, and attaches them to the release of the tag. See
# docs/fork/hemilake-bundle.md.
name: Hemilake bundle

on:
  push:
    tags: ['v*-hemilake.*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Bundle version (default: <package version>-hemilake.dev+<commit>). Only a tag publishes a release.'
        required: false
        type: string

permissions:
  contents: read

jobs:
  bundle:
    if: github.repository == 'hemilake/studio'
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-14, target: darwin-arm64 }
          - { runner: ubuntu-22.04, target: linux-x64 }
          - { runner: ubuntu-22.04-arm, target: linux-arm64 }
    runs-on: ${{ matrix.runner }}
    env:
      # @vscode/ripgrep downloads its binary from GitHub in its postinstall.
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # The native modules are built for this Node, and the bundle carries the same one.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: scripts/fork/hemilake-node-version
          cache: npm

      - name: Version
        id: version
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "$GITHUB_REF_TYPE" = tag ]; then
            version="${GITHUB_REF_NAME#v}"
          elif [ -n "$INPUT_VERSION" ]; then
            version="$INPUT_VERSION"
          else
            version="$(node -p 'require("./package.json").version')-hemilake.dev+${GITHUB_SHA::8}"
          fi
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.-]+)?(\+[0-9A-Za-z.-]+)?$ ]]; then
            echo "Invalid semver version: $version" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"

      - run: npm ci

      # The UI shows the version it was built with: make it the bundle's.
      - env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: npm version "$BUNDLE_VERSION" --no-git-tag-version --allow-same-version

      - run: npm run build

      - env:
          BUNDLE_VERSION: ${{ steps.version.outputs.version }}
        run: node scripts/fork/build-hemilake-bundle.mjs --version "$BUNDLE_VERSION"

      # Start the bundle with a PATH that has no Node and check it answers.
      - name: Smoke test
        run: |
          set -eu
          unpacked="$(mktemp -d)"
          home="$(mktemp -d)"
          tar -xJf release/hemilake-bundle/*.tar.xz -C "$unpacked"
          bundle="$(echo "$unpacked"/hemilake-studio-*)"
          env -i HOME="$home" PATH=/usr/bin:/bin DATABASE_PATH="$home/auth.db" SERVER_PORT=18797 \
            "$bundle/bin/hemilake-studio" > "$home/server.log" 2>&1 &
          server=$!
          for _ in $(seq 1 60); do curl -sf http://127.0.0.1:18797/health > /dev/null && break; sleep 1; done
          curl -sf http://127.0.0.1:18797/health
          curl -sf http://127.0.0.1:18797/api/auth/status | grep -q '"needsSetup":true'
          curl -sf http://127.0.0.1:18797/ | grep -q '<title>Hemilake Studio'
          curl -sf -X POST -H 'content-type: application/json' -d '{"username":"smoke","password":"smoke-test-123"}' \
            http://127.0.0.1:18797/api/auth/register | grep -q '"success":true'
          kill "$server"
          cat "$home/server.log" | tail -20

      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: hemilake-studio-${{ matrix.target }}
          path: release/hemilake-bundle/*
          if-no-files-found: error

  release:
    needs: bundle
    if: github.repository == 'hemilake/studio' && github.ref_type == 'tag'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          path: assets
          merge-multiple: true

      - name: Publish
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -eu
          cd assets
          cat ./*.sha256 > SHA256SUMS
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+-hemilake\.[0-9A-Za-z.-]+$ ]]; then
            echo "Unexpected release tag: $GITHUB_REF_NAME" >&2
            exit 1
          fi
          cat > notes.md <<EOF
          Hemilake Studio $version, self-contained for hemi: each archive carries Node, the server, the UI and the native modules for its platform. Sums in SHA256SUMS. Built from $GITHUB_SHA.

          A modified version of CloudCLI UI (https://github.com/siteboon/claudecodeui), AGPL-3.0-or-later; the source is this tag.
          EOF
          gh release create "$GITHUB_REF_NAME" ./*.tar.xz ./*.sha256 SHA256SUMS \
            --repo "$GITHUB_REPOSITORY" --title "Hemilake Studio $version" --notes-file notes.md
